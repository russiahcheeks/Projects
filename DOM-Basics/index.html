<!DOCTYPE html>
<html>
<head>
    <title>DOM Basics</title>

    <style>
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <h2>Click Counter</h2>
    <p>Count: <span id="counter">0</span></p>
    <button id="countBtn">Increase Counter</button>

    <hr>

    <h2>Text Toggle</h2>
    <button id="toggleBtn">Show/Hide Text</button>
    <p id="toggleText">This text can be hidden and shown.</p>

    <hr>

    <h2>Live Input Echo</h2>
    <input type="text" id="echoInput">
    <p id="echoOutput"></p>

    <hr>

    <h2>Dynamic List</h2>
    <input type="text" id="listInput">
    <button id="addBtn">Add Item</button>

    <ul id="itemList"></ul>

    <script src="script.js"></script>

</body>
</html>
